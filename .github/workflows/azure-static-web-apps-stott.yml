name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      # The SWA only hosts the /api login Functions — the exam itself is
      # served by GitHub Pages. Stage a MINIMAL app dir: routes/CORS config
      # + injected key + a stub index (mirrors the Classroom-survivors setup).
      - name: Stage minimal SWA app (API host only)
        shell: bash
        run: |
          mkdir -p swa_app
          cp staticwebapp.config.json swa_app/
          printf '<!doctype html><title>Stott Exam API</title>API host. The exam lives at https://vpietri-stack.github.io/Stott-reformer-exam/\n' > swa_app/index.html
      - name: Inject client app config (keep app key out of repo)
        if: ${{ env.APP_CLIENT_KEY != '' }}
        env:
          APP_CLIENT_KEY: ${{ secrets.APP_CLIENT_KEY }}
        shell: bash
        run: |
          printf '{"APP_API_KEY":"%s"}\n' "$APP_CLIENT_KEY" > swa_app/app-config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STOTT }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "swa_app" # minimal API-host app (see staging step)
          api_location: "api" # Api source code path
          output_location: "" # no build output dir
          skip_app_build: true # plain static stub, nothing to build
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STOTT }}
          action: "close"
