<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斯多特普拉提 (STOTT PILATES) 模拟考试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-btn {
            transition: all 0.2s ease;
        }

        .option-btn:disabled {
            cursor: default;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans text-slate-800 p-4">

    <div id="app" class="max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative fade-in">

        <!-- Header -->
        <div class="bg-teal-700 text-white p-6 md:p-8 text-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight">STOTT PILATES®</h1>
            <p class="text-teal-100 mt-2 text-sm md:text-base">Intensive Reformer (IR) 理论模拟考试</p>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="p-8 md:p-12 text-center">
            <h2 class="text-xl font-semibold mb-4">准备好测试你的知识了吗？</h2>
            <p class="text-slate-600 mb-8 max-w-lg mx-auto">
                题库共包含 130 道精选试题（涵盖解剖学、姿势分析、普拉提五大基本原则及塑身机动作库）。每次测试将<strong>随机打乱并测试所有题目</strong>。
            </p>
            <button onclick="startQuiz()"
                class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                开始模拟考试
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden p-6 md:p-8">
            <div class="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                <span id="question-tracker">题目: 1 / 130</span>
                <span id="score-tracker" class="text-teal-600">得分: 0</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-teal-600 h-2.5 rounded-full transition-all duration-300"
                    style="width: 10%"></div>
            </div>

            <div id="question-container" class="fade-in">
                <h3 id="question-text" class="text-lg md:text-xl font-semibold mb-6 leading-relaxed">这里是题目内容？</h3>

                <div id="options-container" class="space-y-3">
                    <!-- Options injected via JS -->
                </div>

                <div id="feedback-container"
                    class="hidden mt-6 p-4 rounded-lg bg-slate-50 border border-slate-200 fade-in">
                    <p id="feedback-title" class="font-bold mb-1"></p>
                    <p id="feedback-text" class="text-slate-600 text-sm"></p>
                </div>
            </div>

            <div class="mt-8 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()"
                    class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-6 rounded-lg shadow transition-colors">
                    下一题
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-8 md:p-12 text-center fade-in">
            <div id="result-icon" class="text-6xl mb-4">🏆</div>
            <h2 class="text-2xl font-bold mb-2">测试完成！</h2>
            <p class="text-lg text-slate-600 mb-6">你的最终得分是: <strong id="final-score"
                    class="text-teal-700 text-3xl"></strong> / <span id="total-questions-result">130</span></p>

            <div id="result-message" class="text-slate-700 mb-8 p-4 bg-teal-50 rounded-lg">
                <!-- Result message injected via JS -->
            </div>

            <button onclick="startQuiz()"
                class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-full shadow transition-colors">
                重新测试 (抽取新题)
            </button>
        </div>

    </div>

    <script>

        const questionDatabase = [

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const qData = currentQuiz[currentIndex];
            const totalQuestions = currentQuiz.length;

            // Update Trackers
            document.getElementById('question-tracker').innerText = `题目: ${currentIndex + 1} / ${totalQuestions}`;
            document.getElementById('score-tracker').innerText = `得分: ${score}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / totalQuestions) * 100}%`;

            // Hide next button & feedback
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback-container').classList.add('hidden');

            // Set Question Text
            const qText = document.getElementById('question-text');
            qText.innerText = `${currentIndex + 1}. ${qData.q}`;

            // Remove animation class and re-add for effect
            const qContainer = document.getElementById('question-container');
            qContainer.classList.remove('fade-in');
            void qContainer.offsetWidth; // trigger reflow
            qContainer.classList.add('fade-in');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-400 hover:bg-teal-50 font-medium text-slate-700';
                btn.innerText = String.fromCharCode(65 + index) + ". " + optText;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const qData = currentQuiz[currentIndex];
            const isCorrect = (selectedIndex === qData.ans);
            const allBtns = document.querySelectorAll('.option-btn');

            // Disable all buttons
            allBtns.forEach(btn => btn.disabled = true);

            // Highlight answers
            allBtns.forEach((btn, index) => {
                if (index === qData.ans) {
                    // Correct answer -> Green
                    btn.classList.remove('border-slate-200', 'hover:border-teal-400', 'hover:bg-teal-50');
                    btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                } else if (index === selectedIndex && !isCorrect) {
                    // Wrong selection -> Red
                    btn.classList.remove('border-slate-200', 'hover:border-teal-400', 'hover:bg-teal-50');
                    btn.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
                } else {
                    // Dim others
                    btn.classList.add('opacity-50');
                }
            });

            // Handle Score & Feedback
            const feedbackBox = document.getElementById('feedback-container');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');

            feedbackBox.classList.remove('hidden');
            feedbackText.innerText = qData.rationale;

            if (isCorrect) {
                score++;
                document.getElementById('score-tracker').innerText = `得分: ${score}`;
                feedbackTitle.innerText = "✅ 回答正确！";
                feedbackTitle.className = "font-bold mb-1 text-green-700";
                feedbackBox.className = "mt-6 p-4 rounded-lg border bg-green-50 border-green-200 fade-in";
            } else {
                feedbackTitle.innerText = "❌ 回答错误";
                feedbackTitle.className = "font-bold mb-1 text-red-700";
                feedbackBox.className = "mt-6 p-4 rounded-lg border bg-red-50 border-red-200 fade-in";
            }

            // Show Next Button
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuiz.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = score;
            document.getElementById('total-questions-result').innerText = currentQuiz.length;
            document.getElementById('progress-bar').style.width = '100%';

            const msgEl = document.getElementById('result-message');
            let msg = "";
            const scorePercentage = score / currentQuiz.length;
            if (scorePercentage >= 0.9) {
                msg = "太棒了！你的理论知识非常扎实，完全具备了通过真实考试的水平！";
                document.getElementById('result-icon').innerText = "🏆";
            } else if (scorePercentage >= 0.7) {
                msg = "表现不错！你已经掌握了大部分核心概念，再复习一下错题部分就完美了。";
                document.getElementById('result-icon').innerText = "⭐";
            } else {
                msg = "继续加油！建议重新复习一遍普拉提五大基本原则和肌肉解剖学部分。";
                document.getElementById('result-icon').innerText = "📚";
            }
            msgEl.innerText = msg;
        }
    </script>
</body>

</html>
